name: gymmane-prod

x-backend: &backend
  image: gymmane-backend:${GYMMANE_RELEASE:?Full release SHA required}
  build:
    context: ..
    dockerfile: Dockerfile
  user: node
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  pids_limit: 128
  mem_limit: 512m

x-database-env: &database-env
  DATABASE_URL: postgresql://${GYMMANE_DB_USER:?Database user required}:${GYMMANE_DB_PASSWORD:?Database password required}@db:5432/${GYMMANE_DB_NAME:?Database name required}

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GYMMANE_DB_USER:?Database user required}
      POSTGRES_PASSWORD: ${GYMMANE_DB_PASSWORD:?Database password required}
      POSTGRES_DB: ${GYMMANE_DB_NAME:?Database name required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    <<: *backend
    restart: "no"
    command: [node, deploy/migrate.mjs]
    environment: *database-env
    networks: [database]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *database-env
      GYMMANE_RELEASE: ${GYMMANE_RELEASE:?Full release SHA required}
      AUTH_ISSUER: ${AUTH_ISSUER:?HTTPS auth issuer required}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?Auth audience required}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:?HTTPS JWKS URL required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ALLOW_LOCAL_AUTH: "false"
      STRAVA_ENABLED: ${STRAVA_ENABLED:-false}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-}
      STRAVA_TOKEN_KEY: ${STRAVA_TOKEN_KEY:-}
    ports:
      - 127.0.0.1:${GYMMANE_HTTP_PORT:-18080}:8080
    networks: [database, egress]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - 'try { const r = await fetch("http://127.0.0.1:8080/health", {signal: AbortSignal.timeout(18000)}); const b = await r.json(); if (!r.ok || b.status !== "ok" || b.release !== process.env.GYMMANE_RELEASE) process.exit(1); } catch { process.exit(1); }'
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s

networks:
  database:
    internal: true
  egress: {}

volumes:
  postgres-data: {}
